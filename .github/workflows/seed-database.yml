# Fill a cloud database with the demo world, from GitHub rather than a laptop.
#
# A serverless deployment (Vercel) cannot seed itself: its functions are far too
# short-lived for a thousand inserts. Something with no timeout has to do it
# once. This runs the same seeder the server runs, against whatever database
# URL is stored in the repository secret PASHU_DB_URL.
#
# SETUP (once):
#   Settings -> Secrets and variables -> Actions -> New repository secret
#   Name:  PASHU_DB_URL
#   Value: your full Neon connection string, including ?sslmode=require
#
# RUN: Actions -> Seed database -> Run workflow -> type SEED -> Run
#
# The secret is never printed: GitHub masks it in logs, and the seeder only
# prints the host portion of the URL, never the password.
#
# Safe to run twice. An already-populated database is topped up with whatever
# is missing; existing records are never overwritten.

name: Seed database

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type SEED to confirm you want to write to the database'
        required: true
        default: ''

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check the confirmation
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "SEED" ]; then
            echo "::error::Type SEED in the confirm box to run this."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r pashuraksha/requirements.txt

      - name: Check the secret exists
        env:
          PASHU_DB_URL: ${{ secrets.PASHU_DB_URL }}
        run: |
          if [ -z "$PASHU_DB_URL" ]; then
            echo "::error::Repository secret PASHU_DB_URL is not set. See the comments at the top of this file."
            exit 1
          fi
          echo "secret is present (value hidden)"

      - name: Seed
        working-directory: pashuraksha/backend
        env:
          PASHU_DB_URL: ${{ secrets.PASHU_DB_URL }}
        run: python seed_cli.py
